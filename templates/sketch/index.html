<!doctype html>
<html lang="en">
<!--
  SKETCH TEMPLATE: Eric's hand-drawn mockup, sliced into images.
  Each <section> is one slice of source.jpg (header / intro / work / footer).
  Real links, inputs and the submit button sit on top of the drawn boxes, positioned
  in % of each slice so they stay aligned at any screen width.
-->
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eric Millington — I make things on the web and get people noticed online</title>
  <meta name="description" content="Hi! I'm Eric. I make things on the web and get people noticed online. Let's work together.">
  <link rel="canonical" href="https://www.example.com/">
  <meta name="robots" content="index, follow">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Eric Millington">
  <meta property="og:description" content="I make things on the web and get people noticed online.">
  <meta property="og:image" content="https://www.example.com/source.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="theme-color" content="#000000">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&display=swap" rel="stylesheet">
  <script type="application/ld+json">
  { "@context": "https://schema.org", "@type": "Person", "name": "Eric Millington", "url": "https://www.example.com/", "description": "I make things on the web and get people noticed online." }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; background: #000; }
    body { color: #fff; font-family: "Architects Daughter", "Comic Sans MS", cursive; }
    .sheet { width: min(100%, 1100px); margin: 0 auto; container-type: inline-size; }
    .slice { position: relative; display: block; }
    .slice > img { display: block; width: 100%; height: auto; }
    .hot { position: absolute; display: block; }
    .sr-only { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

    /* Links and buttons drawn in the sketch: invisible hit areas over the drawing */
    a.hot, button.hot { color: transparent; background: transparent; border: 0; padding: 0; cursor: pointer; border-radius: 1.2cqw; transition: box-shadow .2s, background-color .2s; }
    a.hot:hover, button.hot:hover { background: rgb(120 220 120 / .08); box-shadow: 0 0 2.4cqw rgb(120 220 120 / .35); }
    a.hot:focus-visible, button.hot:focus-visible { outline: 0.25cqw dashed #9fe59f; outline-offset: 0.4cqw; }

    /* Inputs sit inside the drawn boxes: no box of their own, handwriting-style text */
    .hot input {
      width: 100%; height: 100%; border: 0; margin: 0; padding: 0 1.4cqw;
      background: transparent; color: #fff; caret-color: #9fe59f;
      font: 2.3cqw/1 "Architects Daughter", "Comic Sans MS", cursive; text-transform: uppercase; letter-spacing: .05em;
      border-radius: 1cqw; transition: background-color .2s;
    }
    .hot input:focus { outline: none; background: rgb(120 220 120 / .1); }
    .hot input:user-invalid { background: rgb(255 90 90 / .14); }

    .thanks { font-size: 2.4cqw; line-height: 1; text-transform: uppercase; letter-spacing: .08em; color: #9fe59f; text-align: center; margin: 0; }
  </style>
</head>
<body id="top">
  <div class="sheet">
    <header class="slice">
      <img src="header.jpg" width="2048" height="253" alt="">
      <a class="hot" href="#top" style="left:4.49%;top:19.37%;width:25.39%;height:62.06%"><h1 class="sr-only">Eric Millington website</h1><span class="sr-only">Home</span></a>
      <a class="hot" href="#contact" style="left:66.99%;top:22.13%;width:26.27%;height:41.50%">Contact me</a>
    </header>

    <main>
      <section class="slice" aria-label="About">
        <img src="intro.jpg" width="2048" height="642" alt="Hand-drawn portrait of Eric in a baseball cap with a beard, next to the words: Hi! I'm Eric and I make things on the web and get people noticed online.">
      </section>

      <section class="slice" id="contact" aria-labelledby="work-title">
        <img src="work.jpg" width="2048" height="874" alt="A hand-drawn sketch of a website layout, labeled: Website!">
        <h2 class="sr-only" id="work-title">Let's work together</h2>
        <form name="contact" action="#" method="post" data-thanks>
          <div class="hot" style="left:24.66%;top:29.18%;width:27.59%;height:8.58%"><label class="sr-only" for="f-name">Name</label><input id="f-name" name="name" type="text" autocomplete="name" required></div>
          <div class="hot" style="left:25.39%;top:45.77%;width:27.34%;height:8.58%"><label class="sr-only" for="f-email">Email</label><input id="f-email" name="email" type="email" autocomplete="email" required></div>
          <div class="hot" style="left:26.12%;top:63.50%;width:26.61%;height:9.15%"><label class="sr-only" for="f-phone">Phone</label><input id="f-phone" name="phone" type="tel" autocomplete="tel" inputmode="tel"></div>
          <button class="hot" type="submit" style="left:38.33%;top:83.52%;width:16.60%;height:10.30%">Go!</button>
          <p class="hot thanks" role="status" style="left:7.32%;top:95.54%;width:50.29%;height:4.00%"></p>
        </form>
      </section>
    </main>

    <footer class="slice">
      <img src="footer.jpg" width="2048" height="352" alt="This is a footer">
      <nav aria-label="Footer">
        <a class="hot" href="#top" style="left:81.54%;top:28.69%;width:9.28%;height:24.15%">Home</a>
        <a class="hot" href="#contact" style="left:81.05%;top:58.52%;width:13.67%;height:19.89%">Contact</a>
      </nav>
    </footer>
  </div>

  <script>
    /* Demo submit: with action="#", show a thank-you line under the Go! button.
       Point action at a real endpoint (Formspree, Basin, etc.) to receive messages. */
    document.querySelector("form[data-thanks]").addEventListener("submit", function (e) {
      var action = this.getAttribute("action");
      var status = this.querySelector(".thanks");
      if (action && action !== "#") return;
      e.preventDefault();
      status.textContent = "Thanks! Talk soon.";
      this.reset();
    });
  </script>
</body>
</html>
